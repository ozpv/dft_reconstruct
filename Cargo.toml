[package]
name = "dft_reconstruct"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
hashbrown = "0.17.1"
itertools = "0.14.0"
num-complex = "0.4.6"
realfft = "3.5.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# strip = "debuginfo"